server:
  port: 8080

spring:
  application:
    name: tcm-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tcm}
    username: ${DB_USERNAME:tcm}
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    parameters:
      # Bootstrap admin seeded by 20260905-02-seed-bootstrap-admin.yaml.
      # Default credentials: admin@tcm.local / ChangeMe123! - documented in
      # README, rotate before any real deployment.
      bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@tcm.local}
      bootstrap-admin-password-hash: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:$2a$10$MWeAhDLU78RJHul4Jc9osuy8MtK8m8RecYyoaTWy/vu4C.Gb9HGuG}
