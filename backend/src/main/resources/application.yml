server:
  port: 8080

spring:
  application:
    name: tcm-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tcm}
    username: ${DB_USERNAME:tcm}
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    parameters:
      # Bootstrap admin seeded by 20260905-02-seed-bootstrap-admin.yaml.
      # Default credentials: admin@tcm.local / ChangeMe123! - documented in
      # README, rotate before any real deployment.
      bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@tcm.local}
      bootstrap-admin-password-hash: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:$2a$10$MWeAhDLU78RJHul4Jc9osuy8MtK8m8RecYyoaTWy/vu4C.Gb9HGuG}

certificates:
  # Where generated certificate PDFs are written. A named Docker volume is
  # mounted here in docker-compose.yml, so they outlive the container.
  storage-path: ${CERTIFICATES_STORAGE_PATH:./data/certificates}
  # Percentage of marked sessions a student must have attended to be
  # certified - see CertificateEligibilityService.
  minimum-attendance-rate: ${CERTIFICATES_MIN_ATTENDANCE_RATE:75}

app:
  jwt:
    secret: ${JWT_SECRET:changeme}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  # Where the QR code's check-in link points - the frontend, which is what a
  # phone camera opens (TCM-27).
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  qr:
    # A session's QR token is deliberately short-lived: it is shown on a
    # screen in the room, so it should stop working soon after the class
    # does. The trainer regenerates it when they need a fresh one.
    secret: ${QR_SECRET:${JWT_SECRET:changeme}}
    validity-minutes: ${QR_VALIDITY_MINUTES:15}
