databaseChangeLog:
  - changeSet:
      id: 20260919-05-seed-demo-data
      author: irad
      contextFilter: demo
      comment: >
        Demo data (TCM-30), so `docker compose up` gives something to click
        around in rather than an empty database. It runs only under the
        `demo` Liquibase context (spring.liquibase.contexts, `demo` by
        default, `prod` for a real deployment and `test` for the test
        suite), which is why it can sit in the same master changelog as the
        schema without ever reaching production.

        Everything is fixed UUIDs and one statement, so re-running is a
        no-op rather than a second copy. Dates are relative to CURRENT_DATE,
        so the schedule still has a past and a future whenever the demo is
        run. Every account's password is the bootstrap admin's -
        ChangeMe123! - documented in the README.

        No certificates are seeded: a certificate row needs its PDF on disk
        to be downloadable, and the file lives in a volume this changelog
        can't write to. Issuing one from the UI is part of the demo.
