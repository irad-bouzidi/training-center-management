server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: let the React Router handle any unknown path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy wiring to the backend service (Docker Compose gives the backend
    # container the hostname "backend"). The upstream is held in a variable
    # so nginx resolves it lazily per-request via the Docker embedded DNS
    # resolver, instead of at config load time - that lets this image start
    # standalone (docker run, no "backend" host) instead of failing to boot
    # when the hostname can't be resolved yet.
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        set $backend_upstream http://backend:8080;
        # No URI after $backend_upstream: nginx doesn't do the usual
        # location-prefix substitution when proxy_pass's target contains a
        # variable, so appending a static path (e.g. "/api/") here would
        # send that literal string to every request instead of the real
        # one. Backend routes already live under /api/v1/... (see
        # docs/PLAN.md), matching what the browser requests, so forwarding
        # the incoming URI unmodified is exactly what's needed.
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
